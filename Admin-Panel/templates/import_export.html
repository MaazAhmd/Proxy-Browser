{% extends "base.html" %}
{% set page = 'import_export' %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h2 class="text-2xl font-semibold text-gray-800 mb-6">Import / Export Users and Proxies</h2>

  <!-- Users Section -->
  <div class="bg-white shadow-md rounded-2xl p-6 mb-8 border border-gray-100">
    <h4 class="text-lg font-semibold text-gray-700 mb-4">Users</h4>
    <div class="flex flex-wrap gap-3 mb-4">
      <a href="{{ url_for('import_export.export_users') }}"
         class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
        Export Users
      </a>
      <a href="{{ url_for('import_export.download_users_template') }}"
         class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
        Download Template
      </a>
    </div>

    <form action="{{ url_for('import_export.import_users') }}"
          method="POST"
          enctype="multipart/form-data"
          class="flex flex-col sm:flex-row sm:items-center gap-3 mt-2">
      <input type="file" name="file" required
             class="block w-full text-sm text-gray-700 bg-gray-50 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">
        Import Users
      </button>
    </form>
  </div>

  <!-- Proxies Section -->
  <div class="bg-white shadow-md rounded-2xl p-6 border border-gray-100">
    <h4 class="text-lg font-semibold text-gray-700 mb-4">Proxies</h4>
    <div class="flex flex-wrap gap-3 mb-4">
      <a href="{{ url_for('import_export.export_proxies') }}"
         class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
        Export Proxies
      </a>
      <a href="{{ url_for('import_export.download_proxies_template') }}"
         class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
        Download Template
      </a>
    </div>

    <form action="{{ url_for('import_export.import_proxies') }}"
          method="POST"
          enctype="multipart/form-data"
          class="flex flex-col sm:flex-row sm:items-center gap-3 mt-2">
      <input type="file" name="file" required
             class="block w-full text-sm text-gray-700 bg-gray-50 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition w-full sm:w-auto">
        Import Proxies
      </button>
    </form>
  </div>
</div>
{% endblock %}
