<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title if title else "Admin Panel" }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="{{ url_for('static', filename='images/logo.ico') }}" type="image/x-icon" />
</head>

<body class="min-h-screen flex flex-col justify-center items-center bg-gradient-to-br from-blue-50 to-blue-100">

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="fixed top-6 w-full flex justify-center z-50">
    <div class="max-w-lg w-full px-4">
      {% for category, message in messages %}
      <div
        class="mb-3 rounded-lg px-4 py-3 text-sm font-medium shadow-md
        {% if category == 'success' %} bg-green-100 text-green-800 border border-green-300
        {% elif category == 'error' %} bg-red-100 text-red-800 border border-red-300
        {% elif category == 'warning' %} bg-yellow-100 text-yellow-800 border border-yellow-300
        {% else %} bg-blue-100 text-blue-800 border border-blue-300 {% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}
  {% endwith %}

  <!-- Login Card -->
  <div class="bg-white/90 backdrop-blur-sm shadow-xl rounded-2xl p-8 w-full max-w-sm border border-gray-100">
    <div class="flex flex-col items-center mb-6">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="h-28 w-auto mb-4">
      <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
    </div>

    <form method="POST" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-sm transition focus:ring-4 focus:ring-blue-200"
      >
        Login
      </button>
    </form>
  </div>

  <footer class="mt-8 text-sm text-gray-500">
    &copy; {{ current_year if current_year else "2025" }} Espot Solutions. All rights reserved.
  </footer>

</body>
</html>
