{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-10">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-gray-800">
            Edit Content for <span class="text-blue-600">Login Screen</span>
        </h2>
        <a href="{{ url_for('content.manage_login_content') }}"
           class="inline-flex items-center px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium rounded-lg shadow-sm transition-all duration-200">
            <i class="bi bi-arrow-left mr-2"></i> Cancel
        </a>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
        <form method="POST" class="p-6 space-y-6">

            <!-- Logo URL -->
            <div>
                <label for="logo_url" class="block text-sm font-medium text-gray-700 mb-2">Logo URL</label>
                <input
                    type="text"
                    id="logo_url"
                    name="logo_url"
                    value="{{ content.logo_url if content else '' }}"
                    placeholder="Enter logo URL"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                />
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phone_number" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                <input
                    type="text"
                    id="phone_number"
                    name="phone_number"
                    value="{{ content.phone_number if content else '' }}"
                    placeholder="Enter contact phone number"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                />
            </div>

            <!-- Slogan -->
            <div>
                <label for="slogan" class="block text-sm font-medium text-gray-700 mb-2">Slogan</label>
                <input
                    type="text"
                    id="slogan"
                    name="slogan"
                    value="{{ content.slogan if content else '' }}"
                    placeholder="Enter slogan text"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                />
            </div>

            <!-- Contact Line -->
            <div>
                <label for="contact_line" class="block text-sm font-medium text-gray-700 mb-2">Contact Line</label>
                <input
                    type="text"
                    id="contact_line"
                    name="contact_line"
                    value="{{ content.contact_line if content else '' }}"
                    placeholder="Enter contact line or message"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                />
            </div>

            <!-- Actions -->
            <div class="flex justify-end items-center gap-3 pt-4 border-t border-gray-100">
                <a href="{{ url_for('content.manage_login_content') }}"
                   class="inline-flex items-center px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-medium rounded-lg transition-all">
                    <i class="bi bi-x-circle mr-1"></i> Cancel
                </a>
                <button
                    type="submit"
                    class="inline-flex items-center px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg shadow-sm transition-all">
                    <i class="bi bi-check-circle mr-1"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
