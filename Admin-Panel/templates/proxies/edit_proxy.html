{% extends "base.html" %}
{% block content %}

<div class="max-w-lg mx-auto mt-12 bg-white border border-gray-200 rounded-2xl shadow-md p-8">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
    Edit Proxy
  </h1>

  <form method="post" class="space-y-5">
    <!-- Username -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
        Username
      </label>
      <input
        type="text"
        id="username"
        name="username"
        value="{{ proxy.username }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
        Password
      </label>
      <input
        type="text"
        id="password"
        name="password"
        value="{{ proxy.password }}"
        required
        placeholder="Enter new password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Host -->
    <div>
      <label for="host" class="block text-sm font-medium text-gray-700 mb-1">
        Host
      </label>
      <input
        type="text"
        id="host"
        name="host"
        value="{{ proxy.host }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Port -->
    <div>
      <label for="port" class="block text-sm font-medium text-gray-700 mb-1">
        Port
      </label>
      <input
        type="text"
        id="port"
        name="port"
        value="{{ proxy.port }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Buttons -->
    <div class="flex items-center justify-between pt-4">
      <a
        href="{{ url_for('proxy.index') }}"
        class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition"
      >
        ⬅ Back
      </a>
      <button
        type="submit"
        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition"
      >
        Update Proxy
      </button>
    </div>
  </form>
</div>

{% endblock %}
