{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white shadow-md rounded-2xl p-6 mt-8 border border-gray-100">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Edit User</h1>

  <form method="post" class="space-y-5">
    <!-- Username -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        value="{{ user.username }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        value="{{ user.email }}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Set New Password (Optional)</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Leave blank to keep current password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
      <p class="text-xs text-gray-500 mt-1">Leave blank if you don't want to change the password.</p>
    </div>

    <!-- Buttons -->
    <div class="pt-4">
      <button
        type="submit"
        class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
      >
        Update User
      </button>
    </div>
  </form>
</div>
{% endblock %}
