{% extends "base.html" %} {% block content %}
    <h1 class="mb-4">Add New User</h1>
    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
            />
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required/>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
            />
        </div>
        <div class="mb-3">
            <label for="disabled_after" class="form-label">Disabled After</label>
            <input
                    type="datetime-local"
                    class="form-control"
                    id="disabled_after"
                    name="disabled_after"
                    required
            />
        </div>

        <button class="btn btn-secondary" onclick="copyCredentials()" type="button">Copy Credentials</button>
        <button type="submit" class="btn btn-success">Add User</button>
    </form>

    <script>
        function copyCredentials() {

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const textToCopy = `Username: ${username}\nPassword: ${password}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Credentials copied to clipboard!");
            }).catch(err => {
                console.error("Failed to copy credentials:", err);
                alert("Failed to copy credentials.");
            });
        }
    </script>
{% endblock %}
