{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white shadow-md rounded-2xl p-6 mt-8 border border-gray-100">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Add New User</h1>

  <form method="post" class="space-y-5">
    <!-- Username -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Email -->
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Password -->
    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Disabled After -->
    <div>
      <label for="disabled_after" class="block text-sm font-medium text-gray-700 mb-1">Disabled After</label>
      <input
        type="datetime-local"
        id="disabled_after"
        name="disabled_after"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 pt-4">
      <button
        type="button"
        onclick="copyCredentials()"
        class="w-full sm:w-auto px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition"
      >
        Copy Credentials
      </button>
      <button
        type="submit"
        class="w-full sm:w-auto px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
      >
        Add User
      </button>
    </div>
  </form>
</div>

<!-- JS -->
<script>
  function copyCredentials() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const textToCopy = `Username: ${username}\nPassword: ${password}`;

    navigator.clipboard.writeText(textToCopy)
      .then(() => {
        alert("✅ Credentials copied to clipboard!");
      })
      .catch(err => {
        console.error("Failed to copy credentials:", err);
        alert("❌ Failed to copy credentials.");
      });
  }
</script>
{% endblock %}
