{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto px-4 py-10">
  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-emerald-600 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Add New Group
    </h1>
    <a href="{{ url_for('groups.list_groups') }}"
       class="inline-flex items-center gap-2 text-gray-700 hover:text-gray-900 border border-gray-300 hover:border-gray-400 rounded-lg px-4 py-2 transition bg-white shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back
    </a>
  </div>

  <!-- Card -->
  <div class="bg-white shadow-md rounded-2xl p-8 border border-gray-100">
    <form method="post" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Group Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter group name"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
        />
      </div>

      <div class="flex justify-end">
        <button
          type="submit"
          class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-lg shadow-md transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Add Group
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
