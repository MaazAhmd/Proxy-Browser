{% extends "base.html" %}
{% block content %}

<div class="max-w-6xl mx-auto px-6 py-10">
  <!-- Header -->
  <div class="flex items-center justify-between mb-10">
    <div class="flex items-center gap-2">
      <div class="bg-blue-100 text-blue-600 p-2.5 rounded-xl">
        <i class="bi bi-people-fill text-2xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">User Groups</h1>
    </div>

    <a
      href="{{ url_for('groups.add_group') }}"
      class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition-transform hover:-translate-y-0.5"
    >
      <i class="bi bi-plus-circle"></i>
      Add Group
    </a>
  </div>

  <!-- Card -->
  <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
    {% if groups %}
    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left font-semibold text-gray-600 uppercase tracking-wider">
              Group Name
            </th>
            <th class="px-6 py-3 text-center font-semibold text-gray-600 uppercase tracking-wider w-48">
              Actions
            </th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">
          {% for group in groups %}
          <tr
            class="hover:bg-blue-50/50 transition duration-150 ease-in-out"
          >
            <td class="px-6 py-4 text-gray-800 font-medium">
              {{ group.name }}
            </td>

            <td class="px-6 py-3 text-center">
              <div class="flex items-center justify-center gap-2">
                <!-- View -->
                <a
                  href="{{ url_for('groups.group_users', group_id=group.id) }}"
                  class="inline-flex items-center gap-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 hover:text-blue-800 font-medium px-3 py-1.5 rounded-md transition-all"
                >
                  <i class="bi bi-eye"></i>
                  View
                </a>

                <!-- Edit -->
                <a
                  href="{{ url_for('groups.edit_group', group_id=group.id) }}"
                  class="inline-flex items-center gap-1.5 text-yellow-600 bg-yellow-50 hover:bg-yellow-100 hover:text-yellow-800 font-medium px-3 py-1.5 rounded-md transition-all"
                >
                  <i class="bi bi-pencil-square"></i>
                  Edit
                </a>

                <!-- Delete -->
                <form
                  method="post"
                  action="{{ url_for('groups.delete_group', group_id=group.id) }}"
                  class="inline"
                >
                  <button
                    type="submit"
                    class="inline-flex items-center gap-1.5 text-red-600 bg-red-50 hover:bg-red-100 hover:text-red-800 font-medium px-3 py-1.5 rounded-md transition-all"
                    onclick="return confirm('Are you sure you want to delete this group?');"
                  >
                    <i class="bi bi-trash"></i>
                    Delete
                  </button>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <!-- Empty State -->
    <div class="flex flex-col items-center justify-center py-16 text-center">
      <div class="bg-gray-100 text-gray-500 p-5 rounded-full">
        <i class="bi bi-folder2-open text-4xl"></i>
      </div>
      <p class="mt-4 text-gray-500 text-lg">No groups found.</p>
      <a
        href="{{ url_for('groups.add_group') }}"
        class="inline-flex items-center gap-2 mt-4 text-blue-600 hover:text-blue-700 font-semibold"
      >
        <i class="bi bi-plus-circle"></i>
        Add your first group
      </a>
    </div>
    {% endif %}
  </div>
</div>

{% endblock %}
