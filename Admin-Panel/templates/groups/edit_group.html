{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto py-8 px-4">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 16 16">
        <path d="M12.146.146a.5.5 0 01.708 0l3
        3a.5.5 0 010 .708l-10 10a.5.5 0
        01-.168.11l-5 2a.5.5 0
        01-.65-.65l2-5a.5.5 0
        01.11-.168l10-10zM11.207 2L3
        10.207V11h.793L13 2.793 11.207
        2zM14 3.207L12.793 2 13 2.207
        14.793 4 14 3.207z"/>
      </svg>
      Edit Group
    </h1>

    <a
      href="{{ url_for('groups.list_groups') }}"
      class="inline-flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Back
    </a>
  </div>

  <!-- Card -->
  <div class="bg-white shadow-md rounded-2xl border border-gray-100">
    <div class="p-6">
      <form method="post" class="space-y-6">
        <!-- Group Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Group Name</label>
          <input
            type="text"
            id="name"
            name="name"
            value="{{ group.name }}"
            required
            class="w-full px-4 py-2 text-gray-800 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
          />
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3">
          <button
            type="submit"
            class="inline-flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Save Changes
          </button>

          <a
            href="{{ url_for('groups.list_groups') }}"
            class="inline-flex items-center gap-2 px-5 py-2 border border-gray-300 text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-lg transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
