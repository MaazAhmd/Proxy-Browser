{% extends "base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto mt-10">
  <!-- Card -->
  <div class="bg-white shadow-lg rounded-2xl overflow-hidden border border-gray-100">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-4">
      <h3 class="text-xl font-semibold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M15 14c2.67 0 8 1.34 8 4v2H7v-2c0-2.66 5.33-4 8-4zm-3-2a4
          4 0 100-8 4 4 0 000 8z"/>
        </svg>
        Add User to Group: <span class="font-bold">{{ group.name }}</span>
      </h3>
    </div>

    <!-- Body -->
    <div class="p-6">
      <form method="post" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Username -->
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter username"
              required
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800"
            />
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter user email"
              required
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800"
            />
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <div class="flex">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility(event)"
                title="Show/Hide Password"
                class="px-4 border border-l-0 border-gray-300 rounded-r-lg bg-gray-50 hover:bg-gray-100 text-gray-600 transition"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M16 8s-3-5.5-8-5.5S0 8 0
                  8s3 5.5 8 5.5S16 8 16 8zM8
                  5a3 3 0 100 6 3 3 0 000-6z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Active Until -->
          <div>
            <label for="disabled_after" class="block text-sm font-medium text-gray-700 mb-2">Active Until</label>
            <input
              type="datetime-local"
              id="disabled_after"
              name="disabled_after"
              required
              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-gray-800"
            />
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-4">
          <a
            href="{{ url_for('groups.group_users', group_id=group.id) }}"
            class="inline-flex items-center gap-2 px-5 py-2 border border-gray-300 rounded-lg text-gray-700 bg-gray-50 hover:bg-gray-100 transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            Back
          </a>

          <button
            type="submit"
            class="inline-flex items-center gap-2 px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            Add User
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Password Toggle Script -->
<script>
  function togglePasswordVisibility(event) {
    const input = document.getElementById("password");
    const icon = event.currentTarget.querySelector("svg");
    if (input.type === "password") {
      input.type = "text";
      icon.innerHTML = '<path d="M13.875 18.825A10.05 10.05 0 0112 19.5C7 19.5 2.73 16.11 1.125 12c.502-1.13 1.19-2.18 2.03-3.125M6.75 6.75A10.05 10.05 0 0112 4.5c5 0 9.27 3.39 10.875 7.5a10.05 10.05 0 01-2.49 3.438M15 15l-3-3m0 0l-3-3m3 3l-3 3m3-3l3-3"/>';
    } else {
      input.type = "password";
      icon.innerHTML = '<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM8 5a3 3 0 100 6 3 3 0 000-6z"/>';
    }
  }
</script>

{% endblock %}
